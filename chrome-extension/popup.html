<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Summarizer</title>
  <style>
    /* ── Reset & Base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 380px;
      min-height: 200px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #e8ecf3 0%, #f0f2fa 100%);
      color: #1e293b;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header p {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 1px;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.6);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }

    .status-dot.connected { background: #10b981; }
    .status-dot.checking { background: #f59e0b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Content ── */
    .content {
      padding: 16px 20px;
    }

    /* ── URL Display ── */
    .url-box {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .url-box .yt-icon {
      color: #ef4444;
      font-size: 20px;
      flex-shrink: 0;
    }

    .url-box .url-text {
      font-size: 12px;
      color: #475569;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .url-box .url-title {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Slider ── */
    .slider-group {
      margin-bottom: 16px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .slider-val {
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 6px;
      outline: none;
      background: rgba(59, 130, 246, 0.15);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(59,130,246,0.35);
    }

    /* ── Buttons ── */
    .btn-summarize {
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: white;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(59,130,246,0.3);
      margin-bottom: 8px;
    }

    .btn-summarize:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59,130,246,0.4);
    }

    .btn-summarize:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      color: #475569;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.8);
      color: #1e293b;
    }

    .btn-secondary.active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border-color: transparent;
    }

    /* ── Results Panel ── */
    .results {
      display: none;
      margin-top: 14px;
    }

    .result-card {
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-card .summary-text {
      font-size: 12.5px;
      line-height: 1.65;
      color: #374151;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .result-card .summary-text::-webkit-scrollbar {
      width: 4px;
    }

    .result-card .summary-text::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.12);
      border-radius: 4px;
    }

    /* ── Stats Row ── */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat-chip {
      flex: 1;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-chip .num {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-chip .label {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }

    /* ── Favorites ── */
    .favorites-section {
      margin-top: 14px;
    }

    .favorites-section h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fav-item:hover {
      background: rgba(255,255,255,0.7);
    }

    .fav-item .fav-title {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fav-item .fav-date {
      font-size: 10px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .fav-item .fav-remove {
      font-size: 14px;
      color: #94a3b8;
      cursor: pointer;
      padding: 2px;
      border: none;
      background: none;
      transition: color 0.2s;
    }

    .fav-item .fav-remove:hover { color: #ef4444; }

    .empty-fav {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* ── Progress bar ── */
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(59,130,246,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
    }

    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    /* ── Error ── */
    .error-box {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #dc2626;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    /* ── Not YouTube ── */
    .not-youtube {
      text-align: center;
      padding: 40px 20px;
    }

    .not-youtube .emoji {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .not-youtube h2 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .not-youtube p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: white;
      color: #1e293b;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🎬</div>
    <div>
      <h1>YouTube Summarizer</h1>
      <p>AI-powered video summaries</p>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot checking" id="statusDot"></div>
    <span id="statusText">Checking server...</span>
  </div>

  <!-- Content: Not on YouTube -->
  <div class="content" id="notYoutube" style="display:none;">
    <div class="not-youtube">
      <div class="emoji">📺</div>
      <h2>Navigate to YouTube</h2>
      <p>Open any YouTube video page and click this extension to summarize it instantly.</p>
    </div>

    <!-- Favorites Tab under not-youtube -->
    <div class="favorites-section" id="favSectionAlt">
      <h3>⭐ Saved Favorites</h3>
      <div id="favListAlt"></div>
    </div>
  </div>

  <!-- Content: YouTube page detected -->
  <div class="content" id="mainContent" style="display:none;">

    <!-- Video Info -->
    <div class="url-box">
      <div class="yt-icon">▶️</div>
      <div style="flex:1;overflow:hidden;">
        <div class="url-title" id="videoTitle">Loading video...</div>
        <div class="url-text" id="videoUrl"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="summarize">✨ Summarize</button>
      <button class="tab-btn" data-tab="favorites">⭐ Favorites</button>
    </div>

    <!-- Summarize Tab -->
    <div class="tab-content active" id="tab-summarize">
      <!-- Slider -->
      <div class="slider-group">
        <div class="slider-label">
          <span>Summary Length</span>
          <span class="slider-val" id="sliderVal">25%</span>
        </div>
        <input type="range" id="percentage" min="10" max="50" value="25">
      </div>

      <!-- Summarize Button -->
      <button class="btn-summarize" id="btnSummarize">⚡ Summarize This Video</button>

      <!-- Progress -->
      <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
      </div>

      <!-- Error -->
      <div class="error-box" id="errorBox"></div>

      <!-- Results -->
      <div class="results" id="results">
        <div class="stats-row">
          <div class="stat-chip">
            <div class="num" id="statWords">0</div>
            <div class="label">Original</div>
          </div>
          <div class="stat-chip">
            <div class="num" id="statSummary">0</div>
            <div class="label">Summary</div>
          </div>
          <div class="stat-chip">
            <div class="num" id="statRatio">0%</div>
            <div class="label">Compressed</div>
          </div>
        </div>

        <div class="result-card">
          <h3>📝 Summary</h3>
          <div class="summary-text" id="summaryText"></div>
        </div>

        <div class="btn-row">
          <button class="btn-secondary" id="btnCopy">📋 Copy</button>
          <button class="btn-secondary" id="btnFav">⭐ Save</button>
          <button class="btn-secondary" id="btnPanel">📌 Panel</button>
        </div>
      </div>
    </div>

    <!-- Favorites Tab -->
    <div class="tab-content" id="tab-favorites">
      <div class="favorites-section">
        <div id="favList"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
